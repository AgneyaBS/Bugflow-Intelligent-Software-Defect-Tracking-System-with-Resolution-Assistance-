<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BugFlow - Register</title>

    <style>

        /* ============================================================
           GLOBAL
        ============================================================ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", "Segoe UI", Arial, sans-serif;
            background: #f5f6fa;
            color: #111827;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        /* ============================================================
           REGISTER CONTAINER
        ============================================================ */

        .register-container {
            width: 100%;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;
        }


        /* ============================================================
           REGISTER CARD
        ============================================================ */

        .register-card {
            width: 560px;
            max-width: 100%;

            background: #ffffff;

            border-radius: 16px;

            padding: 45px 50px;

            box-shadow:
                0 10px 35px rgba(15, 23, 42, 0.08);

            border: 1px solid #eef0f5;
        }


        /* ============================================================
           LOGO
        ============================================================ */

        .logo-section {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-section h1 {
            font-size: 40px;
            font-weight: 800;
            color: #111827;
            letter-spacing: -1px;
            margin-bottom: 10px;
        }

        .logo-section p {
            font-size: 16px;
            color: #667085;
            line-height: 1.5;
        }


        /* ============================================================
           WELCOME
        ============================================================ */

        .register-card h2 {
            font-size: 30px;
            font-weight: 700;
            color: #111827;

            margin-bottom: 8px;
        }

        .register-subtitle {
            color: #667085;
            font-size: 17px;

            margin-bottom: 28px;
        }


        /* ============================================================
           FORM
        ============================================================ */

        .form-group {
            margin-bottom: 19px;
        }

        .form-group label {
            display: block;

            font-size: 15px;
            font-weight: 600;

            color: #111827;

            margin-bottom: 8px;
        }


        /* ============================================================
           INPUT
        ============================================================ */

        .form-group input {
            width: 100%;

            height: 52px;

            border: 1px solid #d0d5dd;
            border-radius: 9px;

            padding: 0 16px;

            font-size: 16px;

            color: #111827;
            background: #ffffff;

            outline: none;

            transition: all 0.2s ease;
        }

        .form-group input:focus {
            border-color: #4f46e5;

            box-shadow:
                0 0 0 3px rgba(79, 70, 229, 0.10);
        }

        .form-group input::placeholder {
            color: #98a2b3;
        }


        /* ============================================================
           PASSWORD
        ============================================================ */

        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            padding-right: 52px;
        }

        .password-toggle {
            position: absolute;

            right: 10px;
            top: 50%;

            transform: translateY(-50%);

            width: 36px;
            height: 36px;

            border: none;
            background: transparent;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #667085;

            font-size: 18px;

            border-radius: 6px;
        }

        .password-toggle:hover {
            background: #f2f4f7;
            color: #4f46e5;
        }


        /* ============================================================
           REGISTER BUTTON
        ============================================================ */

        .register-btn {
            width: 100%;

            height: 56px;

            border: none;
            border-radius: 9px;

            background: #4f46e5;

            color: white;

            font-size: 18px;
            font-weight: 700;

            cursor: pointer;

            transition: all 0.2s ease;

            margin-top: 5px;
        }

        .register-btn:hover {
            background: #4338ca;

            transform: translateY(-1px);

            box-shadow:
                0 6px 15px rgba(79, 70, 229, 0.20);
        }

        .register-btn:active {
            transform: translateY(0);
        }

        .register-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }


        /* ============================================================
           MESSAGE
        ============================================================ */

        .register-message {
            text-align: center;

            min-height: 24px;

            margin-top: 18px;

            font-size: 15px;
        }


        /* ============================================================
           LOGIN LINK
        ============================================================ */

        .login-link {
            text-align: center;

            margin-top: 24px;

            color: #667085;

            font-size: 16px;
        }

        .login-link a {
            color: #4f46e5;

            font-weight: 600;

            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }


        /* ============================================================
           MOBILE
        ============================================================ */

        @media (max-width: 600px) {

            .register-container {
                padding: 20px;
            }

            .register-card {
                padding: 40px 25px;
            }

            .logo-section h1 {
                font-size: 34px;
            }

            .register-card h2 {
                font-size: 26px;
            }

        }

    </style>

</head>


<body>


<div class="register-container">


    <div class="register-card">


        <!-- ======================================================
             LOGO
        ======================================================= -->

        <div class="logo-section">

            <h1>
                BugFlow
            </h1>

            <p>
                Software Issue Tracking &amp; Resolution Platform
            </p>

        </div>


        <!-- ======================================================
             WELCOME
        ======================================================= -->

        <h2>
            Create Account
        </h2>

        <p class="register-subtitle">
            Register to start using BugFlow
        </p>


        <!-- ======================================================
             REGISTER FORM
        ======================================================= -->

        <form id="registerForm"
              autocomplete="off">


            <!-- FULL NAME -->

            <div class="form-group">

                <label for="fullName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    name="full_name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >

            </div>


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    autocomplete="off"
                    autocapitalize="none"
                    spellcheck="false"
                    minlength="3"
                    maxlength="50"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="8"
                        maxlength="128"
                        required
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        class="password-toggle"
                        aria-label="Show password"
                        title="Show password"
                    >
                        👁
                    </button>

                </div>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        minlength="8"
                        maxlength="128"
                        required
                    >

                    <button
                        type="button"
                        id="toggleConfirmPassword"
                        class="password-toggle"
                        aria-label="Show password"
                        title="Show password"
                    >
                        👁
                    </button>

                </div>

            </div>


            <!-- REGISTER BUTTON -->

            <button
                type="submit"
                id="registerButton"
                class="register-btn"
            >
                Create Account
            </button>


        </form>


        <!-- ======================================================
             MESSAGE
        ======================================================= -->

        <p
            id="registerMessage"
            class="register-message"
        ></p>


        <!-- ======================================================
             LOGIN
        ======================================================= -->

        <div class="login-link">

            Already have an account?

            <a href="index.html">
                Login here
            </a>

        </div>


    </div>

</div>



<!-- ============================================================
     REGISTER JAVASCRIPT
============================================================ -->

<script>

const API_BASE_URL =
    "http://127.0.0.1:8000";


/* ============================================================
   ELEMENTS
============================================================ */

const registerForm =
    document.getElementById("registerForm");

const registerButton =
    document.getElementById("registerButton");

const registerMessage =
    document.getElementById("registerMessage");

const passwordInput =
    document.getElementById("password");

const confirmPasswordInput =
    document.getElementById("confirmPassword");

const togglePassword =
    document.getElementById("togglePassword");

const toggleConfirmPassword =
    document.getElementById("toggleConfirmPassword");


/* ============================================================
   PASSWORD SHOW / HIDE
============================================================ */

togglePassword.addEventListener(
    "click",
    function () {

        if (passwordInput.type === "password") {

            passwordInput.type = "text";

            togglePassword.textContent = "🙈";

            togglePassword.setAttribute(
                "aria-label",
                "Hide password"
            );

            togglePassword.setAttribute(
                "title",
                "Hide password"
            );

        } else {

            passwordInput.type = "password";

            togglePassword.textContent = "👁";

            togglePassword.setAttribute(
                "aria-label",
                "Show password"
            );

            togglePassword.setAttribute(
                "title",
                "Show password"
            );

        }

    }
);


/* ============================================================
   CONFIRM PASSWORD SHOW / HIDE
============================================================ */

toggleConfirmPassword.addEventListener(
    "click",
    function () {

        if (
            confirmPasswordInput.type ===
            "password"
        ) {

            confirmPasswordInput.type =
                "text";

            toggleConfirmPassword.textContent =
                "🙈";

            toggleConfirmPassword.setAttribute(
                "aria-label",
                "Hide password"
            );

            toggleConfirmPassword.setAttribute(
                "title",
                "Hide password"
            );

        } else {

            confirmPasswordInput.type =
                "password";

            toggleConfirmPassword.textContent =
                "👁";

            toggleConfirmPassword.setAttribute(
                "aria-label",
                "Show password"
            );

            toggleConfirmPassword.setAttribute(
                "title",
                "Show password"
            );

        }

    }
);


/* ============================================================
   REGISTER
============================================================ */

registerForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        /* ----------------------------------------------------
           GET FORM VALUES
        ---------------------------------------------------- */

        const fullName =
            document.getElementById(
                "fullName"
            ).value.trim();


        const username =
            document.getElementById(
                "username"
            ).value.trim();


        const email =
            document.getElementById(
                "email"
            ).value.trim();


        const password =
            passwordInput.value;


        const confirmPassword =
            confirmPasswordInput.value;


        /* ----------------------------------------------------
           VALIDATE PASSWORD
        ---------------------------------------------------- */

        if (
            password !==
            confirmPassword
        ) {

            registerMessage.textContent =
                "Passwords do not match.";

            registerMessage.style.color =
                "#dc2626";

            return;

        }


        /* ----------------------------------------------------
           VALIDATE USERNAME
        ---------------------------------------------------- */

        if (username.length < 3) {

            registerMessage.textContent =
                "Username must contain at least 3 characters.";

            registerMessage.style.color =
                "#dc2626";

            return;

        }


        /* ----------------------------------------------------
           VALIDATE PASSWORD
        ---------------------------------------------------- */

        if (password.length < 8) {

            registerMessage.textContent =
                "Password must contain at least 8 characters.";

            registerMessage.style.color =
                "#dc2626";

            return;

        }


        /* ----------------------------------------------------
           SHOW LOADING
        ---------------------------------------------------- */

        registerMessage.textContent =
            "Creating your account...";

        registerMessage.style.color =
            "#667085";

        registerButton.disabled =
            true;


        try {


            console.log(
                "Registering user:",
                username,
                email
            );


            /* ------------------------------------------------
               SEND REGISTRATION REQUEST
            ------------------------------------------------ */

            const response =
                await fetch(
                    `${API_BASE_URL}/api/v1/auth/register`,
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"

                        },

                        body: JSON.stringify({

                            username:
                                username,

                            email:
                                email,

                            password:
                                password,

                            full_name:
                                fullName

                        })

                    }
                );


            const data =
                await response.json();


            console.log(
                "Registration response:",
                data
            );


            /* ------------------------------------------------
               REGISTRATION FAILED
            ------------------------------------------------ */

            if (!response.ok) {

                registerMessage.textContent =
                    data.detail ||
                    "Registration failed.";

                registerMessage.style.color =
                    "#dc2626";

                registerButton.disabled =
                    false;

                return;

            }


            /* ------------------------------------------------
               SUCCESS
            ------------------------------------------------ */

            registerMessage.textContent =
                "Account created successfully! Redirecting to login...";

            registerMessage.style.color =
                "#16a34a";


            /* ------------------------------------------------
               REDIRECT TO LOGIN
            ------------------------------------------------ */

            setTimeout(
                function () {

                    window.location.href =
                        "index.html";

                },
                1000
            );


        } catch (error) {

            console.error(
                "Registration error:",
                error
            );


            registerMessage.textContent =
                "Unable to connect to BugFlow server.";

            registerMessage.style.color =
                "#dc2626";


            registerButton.disabled =
                false;

        }

    }
);

</script>


</body>

</html>
