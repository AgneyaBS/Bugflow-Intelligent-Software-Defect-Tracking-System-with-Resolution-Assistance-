<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - BugFlow</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
        }

        .forgot-container {
            width: 420px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo i {
            font-size: 42px;
            color: #4f46e5;
            margin-bottom: 10px;
        }

        .logo h1 {
            color: #1e293b;
            font-size: 28px;
            margin-bottom: 6px;
        }

        .logo p {
            color: #64748b;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-size: 14px;
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 12px 12px 40px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
        }

        .input-wrapper input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.1);
        }

        .reset-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #4f46e5;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .reset-btn:hover {
            background: #4338ca;
        }

        .reset-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .message {
            margin-top: 18px;
            padding: 12px;
            border-radius: 7px;
            font-size: 14px;
            display: none;
            line-height: 1.5;
        }

        .message.success {
            display: block;
            background: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }

        .message.error {
            display: block;
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .back-login {
            text-align: center;
            margin-top: 22px;
        }

        .back-login a {
            color: #4f46e5;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .back-login a:hover {
            text-decoration: underline;
        }

        .info {
            margin-bottom: 20px;
            padding: 12px;
            background: #f8fafc;
            border-radius: 7px;
            color: #64748b;
            font-size: 13px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<div class="forgot-container">

    <div class="logo">
        <i class="fa-solid fa-lock"></i>

        <h1>Forgot Password?</h1>

        <p>Reset your BugFlow account password</p>
    </div>

    <div class="info">
        Enter the email address associated with your BugFlow account.
        We will create a password reset request for your account.
    </div>

    <form id="forgotPasswordForm">

        <div class="form-group">
            <label for="email">Email Address</label>

            <div class="input-wrapper">
                <i class="fa-solid fa-envelope"></i>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>
        </div>

        <button type="submit" class="reset-btn" id="resetBtn">
            <i class="fa-solid fa-key"></i>
            Request Password Reset
        </button>

    </form>

    <div id="message" class="message"></div>

    <div class="back-login">
        <a href="index.html">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Login
        </a>
    </div>

</div>


<script>

    const form = document.getElementById("forgotPasswordForm");
    const emailInput = document.getElementById("email");
    const message = document.getElementById("message");
    const resetBtn = document.getElementById("resetBtn");


    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        const email = emailInput.value.trim();

        if (!email) {
            showMessage("Please enter your email address.", "error");
            return;
        }

        resetBtn.disabled = true;

        resetBtn.innerHTML = `
            <i class="fa-solid fa-spinner fa-spin"></i>
            Processing...
        `;

        try {

            const response = await fetch(
                "http://127.0.0.1:8000/api/v1/auth/forgot-password?email="
                + encodeURIComponent(email),
                {
                    method: "POST"
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.detail || "Unable to process password reset request."
                );
            }

            if (data.reset_token) {

                showMessage(
                    `
                    ${data.message}<br><br>

                    <strong>Demo Reset Token:</strong><br>

                    <span style="word-break: break-all;">
                        ${data.reset_token}
                    </span>

                    <br><br>

                    <a href="reset-password.html?token=${encodeURIComponent(data.reset_token)}"
                       style="color:#4f46e5;font-weight:600;">
                        Continue to Reset Password
                    </a>
                    `,
                    "success"
                );

            } else {

                showMessage(data.message, "success");

            }

        } catch (error) {

            console.error("Forgot password error:", error);

            showMessage(
                error.message || "Unable to connect to the BugFlow server.",
                "error"
            );

        } finally {

            resetBtn.disabled = false;

            resetBtn.innerHTML = `
                <i class="fa-solid fa-key"></i>
                Request Password Reset
            `;
        }

    });


    function showMessage(text, type) {

        message.innerHTML = text;

        message.className = "message " + type;

    }

</script>

</body>
</html>
