<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - BugFlow</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
        }

        .reset-container {
            width: 420px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo i {
            font-size: 42px;
            color: #4f46e5;
            margin-bottom: 10px;
        }

        .logo h1 {
            color: #1e293b;
            font-size: 28px;
            margin-bottom: 6px;
        }

        .logo p {
            color: #64748b;
            font-size: 14px;
        }

        .info {
            margin-bottom: 20px;
            padding: 12px;
            background: #f8fafc;
            border-radius: 7px;
            color: #64748b;
            font-size: 13px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-size: 14px;
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 40px 12px 40px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
        }

        .input-wrapper input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.1);
        }

        .toggle-password {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #64748b;
        }

        .reset-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #4f46e5;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .reset-btn:hover {
            background: #4338ca;
        }

        .reset-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .message {
            margin-top: 18px;
            padding: 12px;
            border-radius: 7px;
            font-size: 14px;
            display: none;
            line-height: 1.5;
        }

        .message.success {
            display: block;
            background: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }

        .message.error {
            display: block;
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .back-login {
            text-align: center;
            margin-top: 22px;
        }

        .back-login a {
            color: #4f46e5;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .back-login a:hover {
            text-decoration: underline;
        }

        .password-rules {
            margin-top: -8px;
            margin-bottom: 18px;
            color: #64748b;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="reset-container">

    <div class="logo">
        <i class="fa-solid fa-key"></i>

        <h1>Reset Password</h1>

        <p>Create a new password for your account</p>
    </div>

    <div class="info">
        Enter your new password below. Your reset token is securely
        taken from the password reset link.
    </div>

    <form id="resetPasswordForm">

        <div class="form-group">

            <label for="newPassword">
                New Password
            </label>

            <div class="input-wrapper">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password"
                    required
                >

                <i
                    class="fa-solid fa-eye toggle-password"
                    id="toggleNewPassword"
                ></i>

            </div>

        </div>

        <div class="form-group">

            <label for="confirmPassword">
                Confirm New Password
            </label>

            <div class="input-wrapper">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm new password"
                    required
                >

                <i
                    class="fa-solid fa-eye toggle-password"
                    id="toggleConfirmPassword"
                ></i>

            </div>

        </div>

        <div class="password-rules">
            Make sure both passwords are exactly the same.
        </div>

        <button
            type="submit"
            class="reset-btn"
            id="resetBtn"
        >
            <i class="fa-solid fa-key"></i>
            Reset Password
        </button>

    </form>

    <div id="message" class="message"></div>

    <div class="back-login">
        <a href="index.html">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Login
        </a>
    </div>

</div>


<script>

    const form = document.getElementById("resetPasswordForm");

    const newPasswordInput =
        document.getElementById("newPassword");

    const confirmPasswordInput =
        document.getElementById("confirmPassword");

    const resetBtn =
        document.getElementById("resetBtn");

    const message =
        document.getElementById("message");


    // ============================================================
    // GET RESET TOKEN FROM URL
    // ============================================================

    const urlParams = new URLSearchParams(window.location.search);

    const resetToken = urlParams.get("token");


    // ============================================================
    // CHECK TOKEN
    // ============================================================

    if (!resetToken) {

        showMessage(
            "Invalid password reset link. No reset token was provided.",
            "error"
        );

        resetBtn.disabled = true;
    }


    // ============================================================
    // RESET PASSWORD
    // ============================================================

    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        if (!resetToken) {
            showMessage(
                "Invalid password reset link.",
                "error"
            );
            return;
        }

        const newPassword =
            newPasswordInput.value;

        const confirmPassword =
            confirmPasswordInput.value;


        // Check password match

        if (newPassword !== confirmPassword) {

            showMessage(
                "Passwords do not match. Please try again.",
                "error"
            );

            return;
        }


        // Basic password length validation

        if (newPassword.length < 6) {

            showMessage(
                "Password must contain at least 6 characters.",
                "error"
            );

            return;
        }


        resetBtn.disabled = true;

        resetBtn.innerHTML = `
            <i class="fa-solid fa-spinner fa-spin"></i>
            Resetting Password...
        `;


        try {

            const response = await fetch(
                "http://127.0.0.1:8000/api/v1/auth/reset-password",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        token: resetToken,
                        new_password: newPassword
                    })
                }
            );


            const data = await response.json();


            if (!response.ok) {

                throw new Error(
                    data.detail ||
                    "Unable to reset password."
                );
            }


            if (data.success) {

                showMessage(
                    data.message +
                    " Redirecting to login...",
                    "success"
                );


                form.reset();


                setTimeout(function() {

                    window.location.href =
                        "index.html";

                }, 2000);

            } else {

                showMessage(
                    data.message ||
                    "Invalid or expired reset token.",
                    "error"
                );
            }


        } catch (error) {

            console.error(
                "Reset password error:",
                error
            );

            showMessage(
                error.message ||
                "Unable to connect to the BugFlow server.",
                "error"
            );

        } finally {

            resetBtn.disabled = false;

            resetBtn.innerHTML = `
                <i class="fa-solid fa-key"></i>
                Reset Password
            `;
        }

    });


    // ============================================================
    // SHOW / HIDE PASSWORD
    // ============================================================

    document
        .getElementById("toggleNewPassword")
        .addEventListener("click", function() {

            togglePassword(
                newPasswordInput,
                this
            );

        });


    document
        .getElementById("toggleConfirmPassword")
        .addEventListener("click", function() {

            togglePassword(
                confirmPasswordInput,
                this
            );

        });


    function togglePassword(input, icon) {

        if (input.type === "password") {

            input.type = "text";

            icon.classList.remove("fa-eye");

            icon.classList.add("fa-eye-slash");

        } else {

            input.type = "password";

            icon.classList.remove("fa-eye-slash");

            icon.classList.add("fa-eye");
        }
    }


    // ============================================================
    // MESSAGE FUNCTION
    // ============================================================

    function showMessage(text, type) {

        message.innerHTML = text;

        message.className =
            "message " + type;
    }

</script>

</body>
</html>
